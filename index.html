<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>真经刷词神器 · Web 版</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 词汇总览侧边栏 -->
  <button class="sidebar-toggle" id="sidebarToggle" title="词汇总览" aria-label="词汇总览">📋</button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="vocabSidebar" aria-hidden="true">
    <div class="sidebar-header">
      <h3>📋 词汇总览</h3>
      <button id="closeSidebarBtn" title="关闭">✕</button>
    </div>
    <input type="search" class="sidebar-search" id="sidebarSearch" placeholder="搜索单词或释义…" autocomplete="off">
    <div class="sidebar-stats" id="sidebarStats"></div>
    <div class="sidebar-list" id="sidebarList"></div>
  </aside>

  <main class="container">
    <header class="app-header">
      <h1>✨ 真经刷词神器 <span class="subtitle">Web 版</span></h1>
      <button id="darkModeToggle" class="dark-toggle" title="切换深色模式" aria-label="切换深色模式">🌓</button>
    </header>

    <!-- 顶部控制区 -->
    <section class="controls">
      <select id="chapterSelect" class="select-style" aria-label="选择章节"></select>
      <div class="mode-group" id="modeGroup" role="group" aria-label="练习模式">
        <button class="mode-btn" data-mode="chinese">📖 看中文</button>
        <button class="mode-btn" data-mode="audio">🔊 听音</button>
        <button class="mode-btn active" data-mode="random">🎲 随机</button>
      </div>
    </section>

    <section class="controls controls-sub">
      <div class="tool-group">
        <button id="hintToggle" class="tool-btn">💡 提示</button>
        <button id="timerToggle" class="tool-btn">⏱️ 计时</button>
        <button id="keyboardToggle" class="tool-btn">⌨️ 软键盘</button>
      </div>
      <div class="voice-select-wrap" title="选择单词发音语音">
        <span class="voice-label">🔊 语音</span>
        <select id="voiceSelect" class="select-style select-sm" aria-label="选择发音语音"></select>
      </div>
      <div class="goal-progress" id="goalDisplay">
        <span>🎯 每日目标</span>
        <span id="goalCount">0/50</span>
        <div class="goal-bar"><div class="goal-fill" id="goalFill"></div></div>
        <button id="setGoalBtn" title="设置每日目标">⚙️</button>
      </div>
    </section>

    <div id="timerDisplay" class="mode-indicator timer-row" hidden>
      <span>⏳ 剩余时间</span><span class="timer-display" id="timerSeconds">10</span><span>秒</span>
    </div>

    <!-- 进度与统计 -->
    <div class="progress-row">
      <span class="progress-label">📊 进度 <strong id="progressText">0/0</strong></span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="stats">
      <span>✅ 正确 <strong id="correctCount">0</strong></span>
      <span>❌ 错误 <strong id="wrongCount">0</strong></span>
      <span>🔥 连续答对 <strong id="streakCount">0</strong></span>
    </div>

    <!-- 答题区 -->
    <div class="mode-indicator">
      <span id="modeIcon">🎲</span><span id="modeText">准备开始</span>
      <span class="speech-status" id="speechStatus"></span>
    </div>

    <div class="question-area">
      <div class="chinese-meaning" id="chineseDisplay"></div>
      <button id="audioPlayBtn" class="audio-play-btn" hidden title="播放发音">🔊 再读一次</button>
    </div>

    <div class="letter-slots" id="letterSlots" aria-label="字母输入"></div>
    <div class="result-area" id="resultArea"></div>

    <!-- 答完后的词卡详情 -->
    <div class="word-card" id="wordCard" hidden>
      <div class="word-card-head">
        <span class="wc-word" id="wcWord"></span>
        <span class="wc-phonetic" id="wcPhonetic"></span>
        <span class="wc-pos" id="wcPos"></span>
        <span class="wc-tag" id="wcTag"></span>
      </div>
      <div class="wc-row" id="wcMeaning"></div>
      <div class="wc-row" id="wcRoot"></div>
      <div class="wc-row" id="wcExtra"></div>
      <div class="wc-example">
        <p id="wcExampleEN"></p>
        <p id="wcExampleCN"></p>
      </div>
    </div>

    <!-- 软键盘（按键由 js/app.js 动态生成） -->
    <div class="soft-keyboard" id="softKeyboard" hidden>
      <div class="kb-row"></div>
      <div class="kb-row"></div>
      <div class="kb-row"></div>
      <div class="kb-row kb-row-4"></div>
    </div>

    <!-- 操作按钮 -->
    <div class="actions">
      <button id="addNewWordBtn" title="加入生词本">📌 生词</button>
      <button id="skipBtn">⏭️ 跳过</button>
      <button id="restartBtn">🔄 重新开始</button>
      <button id="repeatBtn">🔊 再读一次</button>
      <button id="nextBtn" class="primary">⏎ 提交 / 下一题</button>
    </div>
    <p class="footer-note">💡 回车判断，再回车下一题｜支持连字符与空格（如 high-tech, El Nino）｜触屏设备可打开软键盘</p>

    <!-- 错题本 / 生词本 -->
    <section class="books">
      <div class="book-panel">
        <div class="book-header" id="wrongBookToggle">
          <h3>📕 错题本 (<span id="wrongBookCount">0</span>)</h3><span class="arrow">▼</span>
        </div>
        <div class="book-list" id="wrongList"></div>
        <button id="clearWrongBtn" class="clear-btn">清空</button>
      </div>
      <div class="book-panel">
        <div class="book-header" id="newWordBookToggle">
          <h3>📗 生词本 (<span id="newWordCount">0</span>)</h3><span class="arrow">▼</span>
        </div>
        <div class="book-list" id="newWordList"></div>
        <button id="clearNewWordsBtn" class="clear-btn">清空</button>
      </div>
    </section>
    <button id="reviewBookBtn" class="primary review-btn">📚 复习错题 + 生词</button>

    <footer class="app-footer">
      <p>词汇课程来自 B 站 <strong>@Theo哥哥教雅思</strong>，内容仅供学习交流。</p>
      <p id="dataInfo"></p>
      <p id="visitCounter" class="visit-counter">🌐 全站访问 <strong>—</strong> 次</p>
    </footer>
  </main>

  <!-- 通用弹窗 -->
  <div class="modal" id="modalRoot" hidden>
    <div class="modal-content" id="modalContent" role="dialog" aria-modal="true"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
