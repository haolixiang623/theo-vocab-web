server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted static assets: cache forever (immutable).
    # Files carry a content hash in their name, so a new deploy gets new
    # names and old names stay valid — safe to cache for 1 year.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML must always revalidate so a new deploy (new index.html referencing
    # new fingerprinted assets) is picked up immediately by every visitor.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
}
